name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: node --check web/game.js
      - run: node --check web/panels.js
      - run: node --check web/state-sync.js
      - run: node --check web/island-scene.js
      - run: node --check web/island-panels.js
      - run: node --check web/cave-scenery.js
      - run: node --check web/trader-scenery.js
      - run: node --test scripts/state-sync.test.cjs
      - run: node scripts/island-panels.test.cjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build Windows deployment
        shell: powershell
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CookieKill-windows-amd64
          path: |
            dist/*.zip
            dist/*.sha256
