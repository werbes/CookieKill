name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...
      - run: node --check web/game.js
      - run: node --check web/touch-controls.js
      - run: node --test scripts/touch-controls.test.cjs
      - run: node --check web/panels.js
      - run: node --check web/state-sync.js
      - run: node --check web/island-scene.js
      - run: node --check web/island-panels.js
      - run: node --check web/island-building-panels.js
      - run: node --check web/cave-scenery.js
      - run: node --check web/club-scenery.js
      - run: node --check web/club-panels.js
      - run: node --check web/funny-cake-effects.js
      - run: node --check web/club-settings.js
      - run: node --check web/club-odds.js
      - run: node --check web/bakery-panels.js
      - run: node --check web/bakery-scene.js
      - run: node --check web/bakery-room.js
      - run: node --check web/bakery-furnishings.js
      - run: node --check web/production-panels.js
      - run: node --check web/production-scenery.js
      - run: node --check web/night-scene.js
      - run: node --check web/john-hut-scenery.js
      - run: node --check web/camel-race-scene.js
      - run: node --check web/camel-race-panels.js
      - run: node --check web/camel-race-state.js
      - run: node --check web/roller-coaster-scene.js
      - run: node --check web/roller-coaster-panels.js
      - run: node --check web/rodents-scene.js
      - run: node --check web/rodents-panels.js
      - run: node --check web/nut-island-scene.js
      - run: node --check web/nut-island-panels.js
      - run: node --check web/camel-training-panels.js
      - run: node --check web/camel-training-scene.js
      - run: node --check web/achievement-panels.js
      - run: node --check web/achievement-painting-art.js
      - run: node --check web/achievement-scenery.js
      - run: node --check web/bouquet-view.js
      - run: node --check web/camel-care-panels.js
      - run: node --check web/camel-view.js
      - run: node --check web/ambient-audio.js
      - run: node --check web/cookie-activity-art.js
      - run: node --check web/tree-ring-scene.js
      - run: node --check web/cookie-practice-scene.js
      - run: node --check web/cookie-activities-panels.js
      - run: node --check web/practice-avatar.js
      - run: node --check web/town-scenery.js
      - run: node --check web/town-panels.js
      - run: node --check web/baking-items.js
      - run: node --check web/roof-scenery.js
      - run: node --check web/flower-scenery.js
      - run: node --check web/trader-scenery.js
      - run: node --check web/motion.js
      - run: node --check web/animal-motion.js
      - run: node --check web/scenery-batches.js
      - run: node --test scripts/state-sync.test.cjs
      - run: node --test scripts/cave-scenery.test.cjs
      - run: node --test scripts/club.test.cjs
      - run: node --test scripts/funny-cake-panels.test.cjs scripts/funny-cake-effects.test.cjs
      - run: node --test scripts/bakery-panels.test.cjs scripts/bakery-scene.test.cjs scripts/bakery-room.test.cjs scripts/bakery-furnishings.test.cjs
      - run: node --test scripts/production-panels.test.cjs scripts/production-scenery.test.cjs scripts/roof-scenery.test.cjs
      - run: node --test scripts/night-scene.test.cjs
      - run: node --test scripts/camel-race-ui.test.cjs scripts/town.test.cjs
      - run: node --test scripts/roller-coaster-ui.test.cjs
      - run: node --test scripts/rodents.test.cjs
      - run: node --test scripts/camel-companions-ui.test.cjs scripts/ambient-audio.test.cjs
      - run: node --test scripts/cookie-activities.test.cjs
      - run: node --test scripts/camel-training-ui.test.cjs scripts/achievements.test.cjs scripts/bouquets.test.cjs
      - run: node --test scripts/home-upgrades.test.cjs
      - run: node --test scripts/motion.test.cjs scripts/scenery-batches.test.cjs
      - run: node --test scripts/animal-interaction.test.cjs scripts/animal-motion.test.cjs
      - run: node scripts/island-panels.test.cjs
      - run: node --test scripts/island-building-panels.test.cjs scripts/teleport-ui.test.cjs
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - name: Build Windows deployment
        shell: powershell
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: CookieKill-windows-amd64
          path: |
            dist/*.zip
            dist/*.sha256
